<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – IT Rack Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <!-- Same header shell as the main app (no nav tabs on login) -->
  <header class="app-header">
    <div class="logo-area" style="cursor: default;">
      <img src="skyworks-logo.png" alt="Skyworks" class="header-logo" />
      <div class="logo-text">
        <span class="logo-main">IT Rack Inventory</span>
        <span class="logo-sub">Deliveries &amp; Hardware Tracking</span>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Sign in to your account</h2>
        <p>Enter your credentials to continue</p>
      </div>

      <div id="error-message" class="login-error"></div>

      <form id="login-form" class="login-form">
        <div class="form-field">
          <label for="username">Username</label>
          <select id="username" required autofocus>
            <option value="">Select an account...</option>
          </select>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn primary btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
