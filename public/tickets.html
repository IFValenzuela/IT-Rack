<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ticket Tracking — IT Rack Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=3" />
  <style>
    /* Kanban Board Styles */
    .kanban-board {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding: 1rem 0;
      align-items: flex-start;
      height: calc(100vh - 200px);
    }
    .kanban-column {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 1rem;
      min-width: 250px;
      max-width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .kanban-column h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kanban-column h3 span {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .kanban-cards {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      min-height: 50px;
    }
    .kanban-card {
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      cursor: grab;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .kanban-card:active {
      cursor: grabbing;
    }
    .kanban-card:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .kanban-card-title {
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: var(--text-main);
    }
    .kanban-card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .kanban-card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .kanban-card-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }
    .btn-create-ticket {
      margin-bottom: 1rem;
    }
    .kanban-column.drag-over {
      background-color: var(--primary-light);
      border: 1px dashed var(--primary);
    }
  </style>
</head>

<body>
  <header class="app-header">
    <a class="logo-area" href="dashboard.html" id="app-logo-area" title="Go to Dashboard">
      <img src="skyworks-logo.png" alt="Skyworks" class="header-logo" />
      <div class="logo-text">
        <span class="logo-main">IT Rack Inventory</span>
        <span class="logo-sub">Deliveries &amp; Hardware Tracking</span>
      </div>
    </a>
    <div class="header-right">
      <div id="user-menu"></div>
      <nav class="nav-tabs">
        <a class="nav-tab" href="dashboard.html">All Devices</a>
        <a class="nav-tab" href="models.html">Models</a>
        <a class="nav-tab" href="phones.html">Phones</a>
        <a class="nav-tab" href="phone-inventory.html">Phone Inventory</a>
        <a class="nav-tab" href="phone-history.html">Phone History</a>
        <a class="nav-tab active" href="tickets.html">Tickets</a>
        <a class="nav-tab" href="statistics.html">Statistics</a>
        <a class="nav-tab" href="history.html">Activity Log</a>
        <a class="nav-tab admin-only hidden" href="admin.html">⚙ Admin</a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <section class="panel active">
      <div class="panel-header">
        <div>
          <h2>Ticket Tracking</h2>
          <p class="panel-subtitle">Track devices through the procurement pipeline.</p>
        </div>
        <div class="panel-header-actions">
          <button type="button" class="btn primary" id="btn-new-ticket">New Ticket</button>
        </div>
      </div>
      <div class="chart-panel" style="background-color: var(--surface); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border);">
        <div style="display: flex; gap: 2rem; align-items: center; max-height: 250px;">
          <div class="explorer-chart-area" style="width: 250px; height: 250px; flex-shrink: 0;">
            <canvas id="tickets-pie-chart"></canvas>
          </div>
          <div id="tickets-chart-legend" style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
            <!-- Custom legend generated by JS -->
          </div>
        </div>
      </div>
      
      <div class="kanban-board" id="kanban-board">
        <!-- Columns generated by JS -->
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- New Ticket Dialog -->
  <div id="new-ticket-dialog" class="dialog-backdrop hidden">
    <div class="dialog">
      <div class="dialog-header">
        <h2>Create Ticket</h2>
      </div>
      <form id="new-ticket-form" class="dialog-body">
        <div class="form-field">
          <label for="ticket-title">Device Model</label>
          <select id="ticket-title" required>
            <option value="">Select a device model...</option>
          </select>
        </div>
        <div class="form-field">
          <label for="ticket-requester">Requester</label>
          <input id="ticket-requester" type="text" placeholder="e.g. John Doe" />
        </div>
        <div class="form-field">
          <label for="ticket-notes">Notes</label>
          <textarea id="ticket-notes" rows="3" placeholder="Additional details..."></textarea>
        </div>
        <div class="dialog-footer">
          <button type="button" class="btn ghost" id="btn-cancel-ticket">Cancel</button>
          <button type="submit" class="btn primary">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Module scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/ui/auth.js" defer></script>
  <script src="js/pages/tickets.js" defer></script>
</body>
</html>
