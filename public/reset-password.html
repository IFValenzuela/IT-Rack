<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password – IT Rack Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <header class="app-header">
    <div class="logo-area" style="cursor: default;">
      <img src="skyworks-logo.png" alt="Skyworks" class="header-logo" />
      <div class="logo-text">
        <span class="logo-main">IT Rack Inventory</span>
        <span class="logo-sub">Deliveries &amp; Hardware Tracking</span>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Set new password</h2>
        <p>Choose a password that is at least 6 characters.</p>
      </div>

      <div id="message" class="login-error" style="display:none;"></div>

      <form id="reset-form" class="login-form">
        <div class="form-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" autofocus />
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="btn primary btn-submit">Reset Password</button>
      </form>

      <p style="margin-top: 16px; text-align: center; font-size: 0.85rem;">
        <a href="login.html">Back to login</a>
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      window.location.replace('login.html');
    }

    const form       = document.getElementById('reset-form');
    const messageDiv = document.getElementById('message');

    function showMessage(text, ok) {
      messageDiv.style.display    = 'block';
      messageDiv.style.background = ok ? '#d4edda' : '#f8d7da';
      messageDiv.style.color      = ok ? '#155724' : '#721c24';
      messageDiv.textContent      = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn       = form.querySelector('button[type="submit"]');

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match.', false);
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Resetting…';
      messageDiv.style.display = 'none';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();

        if (res.ok) {
          showMessage('Password reset successful! Redirecting to login…', true);
          setTimeout(() => window.location.replace('login.html'), 2000);
        } else {
          throw new Error(data.error || 'Reset failed');
        }
      } catch (err) {
        showMessage('Error: ' + err.message, false);
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
