<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | IT Rack Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

  <header class="app-header">
    <div class="logo-area" style="cursor: default;">
      <img src="skyworks-logo.png" alt="Skyworks" class="header-logo" />
      <div class="logo-text">
        <span class="logo-main">IT Rack Inventory</span>
        <span class="logo-sub">Deliveries &amp; Hardware Tracking</span>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Reset your password</h2>
        <p>Enter your email address to receive a reset link.</p>
      </div>

      <div id="message" class="login-error" style="display:none;"></div>

      <form id="forgot-form" class="login-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required autofocus />
        </div>
        <button type="submit" class="btn primary btn-submit">Send Reset Link</button>
      </form>

      <p style="margin-top: 16px; text-align: center; font-size: 0.85rem;">
        <a href="login.html">Back to login</a>
      </p>
    </div>
  </div>

  <script>
    const form       = document.getElementById('forgot-form');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email      = document.getElementById('email').value;
      const submitBtn  = form.querySelector('button[type="submit"]');

      submitBtn.disabled   = true;
      submitBtn.textContent = 'Sending…';
      messageDiv.style.display = 'none';

      try {
        const res  = await fetch('/api/auth/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        const data = await res.json();

        messageDiv.style.display    = 'block';
        messageDiv.style.background = '#d4edda';
        messageDiv.style.color      = '#155724';
        messageDiv.textContent      = data.message || 'Reset link sent! Check your email.';
        form.reset();
      } catch (err) {
        messageDiv.style.display    = 'block';
        messageDiv.style.background = '#f8d7da';
        messageDiv.style.color      = '#721c24';
        messageDiv.textContent      = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
